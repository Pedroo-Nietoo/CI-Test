name: workflow-sandbox-nodejs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      enable_sonar_scan:
        description: "Enable SonarQube scan"
        required: false
        type: boolean
        default: false
      enable_deploy_option:
        description: "Enable deploy option"
        required: false
        type: boolean
        default: false

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Linting
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Execute Unit Tests and Coverage
        run: npm run test:cov | tee coverage_output.txt

      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "Consolidated project coverage analysis:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOTAL_LINE=$(cat coverage_output.txt | grep "All files" | sed 's/|//g' | tr -s " " || echo "")

          if [ -n "$TOTAL_LINE" ]; then
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
            echo "| **Statements** | $(echo "$TOTAL_LINE" | awk '{print $3}')% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Branches** | $(echo "$TOTAL_LINE" | awk '{print $4}')% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Functions** | $(echo "$TOTAL_LINE" | awk '{print $5}')% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Lines** | $(echo "$TOTAL_LINE" | awk '{print $6}')% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage metrics could not be extracted." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1

  sonarqube_scan:
    name: SonarQube Scan
    if: github.event_name != 'workflow_dispatch' || inputs.enable_sonar_scan == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Unit Tests for Coverage
        run: npm run test:cov

      - name: Execute SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }} 
            -Dsonar.organization=pedroo-nietoo
            -Dsonar.sources=src 
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.spec.ts
            -Dsonar.exclusions=src/**/*.spec.ts,src/infra/database/migrations/**,src/**/*.swagger.ts,src/**/seed.ts
            -Dsonar.coverage.exclusions=src/**/*.module.ts,src/**/*.config.ts,src/**/*.dto.ts,src/**/*.entity.ts,src/**/*.enum.ts,src/**/*.decorator.ts,src/**/*.mock.ts,src/**/main.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Check SonarQube Quality Gate
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Summary (Success)
        if: success()
        run: |
          echo "### SonarCloud Scan Approved" >> $GITHUB_STEP_SUMMARY
          echo "The code passed the Quality Gate. No blocking vulnerabilities or code smells were found." >> $GITHUB_STEP_SUMMARY
          echo "[Access Full SonarCloud Report](https://sonarcloud.io/dashboard?id=${{ github.repository_owner }}_${{ github.event.repository.name }})" >> $GITHUB_STEP_SUMMARY

      - name: SonarQube Summary (Failure)
        if: failure()
        run: |
          echo "### SonarCloud Scan Rejected" >> $GITHUB_STEP_SUMMARY
          echo "The Quality Gate failed. Please review the report to address the identified issues." >> $GITHUB_STEP_SUMMARY
          echo "[Access Full SonarCloud Report](https://sonarcloud.io/dashboard?id=${{ github.repository_owner }}_${{ github.event.repository.name }})" >> $GITHUB_STEP_SUMMARY

  publish:
    name: Publish Artifacts
    needs: [build_and_test, sonarqube_scan]
    if: |
      always() &&
      needs.build_and_test.result == 'success' &&
      (needs.sonarqube_scan.result == 'success' || needs.sonarqube_scan.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Artifacts for Deployment
        run: |
          echo "Publish job executed successfully." >> $GITHUB_STEP_SUMMARY
          echo "Artifacts are ready for downstream deployment." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy Application
    needs: [publish]
    if: |
      always() &&
      needs.publish.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.enable_deploy_option == true)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Triggering Render API for service ${{ secrets.RENDER_SERVICE_ID }}..."

          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")
            
          DEPLOY_ID=$(echo $RESPONSE | jq -r '.id')

          if [ "$DEPLOY_ID" == "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "Error triggering deployment: $RESPONSE"
            exit 1
          fi

          echo "Deployment triggered (ID: $DEPLOY_ID). Waiting for Render server completion..."

          STATUS="created"
          while [ "$STATUS" == "created" ] || [ "$STATUS" == "build_in_progress" ] || [ "$STATUS" == "update_in_progress" ]; do
            sleep 15
            STATUS_RESPONSE=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")
            STATUS=$(echo $STATUS_RESPONSE | jq -r '.status')
            echo "Current Render status: $STATUS"
          done

          if [ "$STATUS" == "live" ]; then
            echo "Deployment is successfully online."
            exit 0
          else
            echo "Deployment failed on Render with status: $STATUS"
            exit 1
          fi

      - name: Deploy Summary (Success)
        if: success()
        run: |
          echo "### Deployment Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "The application was compiled and deployed to Render without errors." >> $GITHUB_STEP_SUMMARY
          echo "Access Environment: [https://eventer-api-dev.onrender.com](https://eventer-api-dev.onrender.com)" >> $GITHUB_STEP_SUMMARY

      - name: Deploy Summary (Failure)
        if: failure()
        run: |
          echo "### Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "An error occurred during the Render deployment process." >> $GITHUB_STEP_SUMMARY
          echo "Check the Render dashboard for server logs to identify the build failure." >> $GITHUB_STEP_SUMMARY
