name: workflow-sandbox-nodejs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      enable_sonar_scan:
        description: "Enable SonarQube scan"
        required: false
        type: boolean
        default: false
      enable_deploy_option:
        description: "Enable deploy option"
        required: false
        type: boolean
        default: false

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Linting
        run: npm run lint --if-present

      - name: Build Application
        run: npm run build

      - name: Execute Unit Tests
        run: npm run test --if-present

  sonarqube_scan:
    name: SonarQube Scan
    if: github.event_name != 'workflow_dispatch' || inputs.enable_sonar_scan == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Unit Tests for Coverage
        run: npm run test:cov --if-present

      - name: Execute SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }} 
            -Dsonar.organization=pedroo-nietoo
            -Dsonar.sources=src 
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.spec.ts
            -Dsonar.exclusions=src/**/*.spec.ts,src/infra/database/migrations/**,src/**/*.swagger.ts,src/**/seed.ts
            -Dsonar.coverage.exclusions=src/**/*.module.ts,src/**/*.config.ts,src/**/*.dto.ts,src/**/*.entity.ts,src/**/*.enum.ts,src/**/*.decorator.ts,src/**/*.mock.ts,src/**/main.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Check SonarQube Quality Gate
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Summary (Success)
        if: success()
        run: |
          echo "### SonarCloud Scan Approved" >> $GITHUB_STEP_SUMMARY
          echo "The code passed the Quality Gate." >> $GITHUB_STEP_SUMMARY

      - name: SonarQube Summary (Failure)
        if: failure()
        run: |
          echo "### SonarCloud Scan Rejected" >> $GITHUB_STEP_SUMMARY
          echo "The Quality Gate failed. Review the report." >> $GITHUB_STEP_SUMMARY

  publish:
    name: Publish Artifacts
    needs: [build_and_test, sonarqube_scan]
    if: |
      always() &&
      needs.build_and_test.result == 'success' &&
      (needs.sonarqube_scan.result == 'success' || needs.sonarqube_scan.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install All Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Prune Dev Dependencies
        run: npm prune --omit=dev

      - name: Create Deployment Package
        run: |
          tar -czf deployment-package.tar.gz dist/ node_modules/ package.json package-lock.json

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-package
          path: deployment-package.tar.gz
          retention-days: 1
  deploy:
    name: Deploy to VPS
    needs: [publish]
    if: |
      always() &&
      needs.publish.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.enable_deploy_option == true)
    runs-on: ubuntu-latest
    steps:
      - name: Download Deployment Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-package

      - name: Transfer Artifact via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deployment-package.tar.gz"
          target: "/tmp"

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            APP_DIR="/var/www/eventer-api"
            BACKUP_DIR="/var/www/backups/eventer-api_$(date +%Y%m%d_%H%M%S)"
            APP_NAME="eventer-api"

            echo "Preparing deployment directories..."
            mkdir -p $APP_DIR
            mkdir -p /var/www/backups

            echo "Backing up current version..."
            if [ -d "$APP_DIR/dist" ]; then
              cp -r $APP_DIR $BACKUP_DIR
            fi

            echo "Extracting new release..."
            tar -xzf /tmp/deployment-package.tar.gz -C /tmp/

            echo "Applying updates..."
            rsync -av --delete /tmp/dist/ $APP_DIR/dist/
            rsync -av --delete /tmp/node_modules/ $APP_DIR/node_modules/
            cp /tmp/package.json $APP_DIR/

            echo "Cleaning up temporary files..."
            rm -rf /tmp/deployment-package.tar.gz /tmp/dist /tmp/node_modules /tmp/package.json /tmp/package-lock.json

            echo "Restarting PM2 process..."
            export PATH="$HOME/.nvm/versions/node/v22.0.0/bin:$PATH" # Adjust path according to your VPS node installation
            pm2 restart $APP_NAME || pm2 start $APP_DIR/dist/main.js --name $APP_NAME

            echo "Deployment completed successfully."

      - name: Deploy Summary (Success)
        if: success()
        run: |
          echo "### Deployment Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "The application was successfully packaged, transferred, and restarted on the VPS via PM2." >> $GITHUB_STEP_SUMMARY

      - name: Deploy Summary (Failure)
        if: failure()
        run: |
          echo "### Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "An error occurred during the SCP transfer or SSH deployment script execution." >> $GITHUB_STEP_SUMMARY
