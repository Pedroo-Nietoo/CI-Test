name: Workflow Sandbox (Dev)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      action:
        description: "Selecione a ação desejada:"
        required: true
        default: "Build & Test"
        type: choice
        options:
          - "Build Only"
          - "Build & Test"
          - "Deploy"
      enable_sonar:
        description: "Habilitar análise do SonarQube?"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  test:
    name: 🧪 Run Tests
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'Build & Test' || inputs.action == 'Deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Unit Tests & Coverage
        run: npm run test:cov

      - name: Add Coverage to Summary
        if: always()
        run: |
          echo "### 📊 Resumo de Cobertura (Jest)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          # Extrai a tabela do log do jest para o summary
          npm run test:cov | sed -n '/File/,/---/p' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1

  security:
    name: 🛡️ Security & Quality Scans
    needs: [build, test]
    # Ajustado para rodar mesmo se o teste falhar (failure), permitindo análise do Sonar
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'failure' || needs.test.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.enable_sonar == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Artifact
        # Baixa se o teste rodou, independente do resultado (sucesso ou falha por coverage)
        if: needs.test.result == 'success' || needs.test.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: SonarQube Scan
        if: github.event_name != 'workflow_dispatch' || inputs.enable_sonar == true
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.organization=pedroo-nietoo
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.spec.ts
            -Dsonar.exclusions=src/**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  deploy:
    name: 🚀 Deploy
    needs: [build, test, security]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.security.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.action == 'Deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          echo "Build, Testes e Segurança validados."
          echo "Iniciando Deploy para AWS (Ambiente de Dev)..."
